# flowline documentation site. Build from the repo root:
#   pip install -r docs/requirements.txt
#   mkdocs serve -f docs/mkdocs.yml          # http://127.0.0.1:8000
#   mkdocs build -f docs/mkdocs.yml --strict # what CI runs
site_name: flowline
site_url: https://kashmithnisakya.github.io/flowline/
site_description: >-
  Run, understand, call and deploy flowline: a board that follows your team's
  own flow line and logs every move a task makes, built in Jac.
site_author: Kashmith Nisakya
copyright: Copyright &copy; 2026 Kashmith Nisakya. MIT licensed.

repo_url: https://github.com/kashmithnisakya/flowline
repo_name: kashmithnisakya/flowline
edit_uri: edit/dev/docs/content/

docs_dir: content
site_dir: site

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/brand/logo-mark-dark.svg
  favicon: assets/brand/favicon.svg
  font:
    text: Geist
    code: Geist Mono
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil-outline
    view: material/eye-outline
    admonition:
      note: material/note-text-outline
      tip: material/lightbulb-on-outline
      warning: material/alert-outline
      danger: material/alert-octagon-outline
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Follow the system theme
  features:
    - announce.dismiss
    - content.action.edit
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

extra_css:
  - assets/stylesheets/flowline.css

extra:
  # The branch the reference's "view source" links point at.
  source_ref: dev
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kashmithnisakya/flowline
      name: flowline on GitHub
    - icon: material/rocket-launch-outline
      link: https://flowline.jachammer.app/
      name: The hosted app

hooks:
  - hooks/jac_docs.py

# `mkdocs serve` rebuilds when the Jac sources the reference is read from change.
watch:
  - hooks
  - overrides
  - ../models.jac
  - ../constants.jac
  - ../main.jac
  - ../jac.toml
  - ../services

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: info
  links:
    not_found: warn
    anchors: warn
    absolute_links: info
    unrecognized_links: warn

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
      toc_depth: 3
  - pymdownx.betterem
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  # Paths resolve from the working directory: "." when building from the repo
  # root, ".." when building from docs/.
  - pymdownx.snippets:
      base_path: [".", ".."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Get started:
      - get-started/index.md
      - Install Jac: get-started/install-jac.md
      - Run locally: get-started/run-locally.md
      - Configuration: get-started/configuration.md
      - Single sign-on: get-started/sso.md
      - Connect GitHub: get-started/github-app.md
  - Concepts:
      - concepts/index.md
      - Data graph: concepts/data-graph.md
      - Flow lines: concepts/flow-lines.md
      - The activity log: concepts/activity-log.md
      - Tenancy and security: concepts/security.md
      - GitHub sync: concepts/github-sync.md
  - API reference:
      - api/index.md
      - Authentication: api/authentication.md
      - Projects: api/projects.md
      - Roster and roles: api/roster.md
      - Tasks: api/tasks.md
      - Board: api/board.md
      - Saved filters: api/filters.md
      - Roadmap: api/roadmap.md
      - Activity log: api/log.md
      - Flow lines: api/flow-lines.md
      - Insights: api/insights.md
      - Assistant: api/assistant.md
      - GitHub: api/github.md
      - Webhooks: api/webhooks.md
      - Types: api/types.md
  - Deploy:
      - deploy/index.md
      - Deploy with jachammer: deploy/jachammer.md
      - Production configuration: deploy/production.md
      - Operations: deploy/operations.md
  - Contributing:
      - contributing/index.md
      - Verification and CI: contributing/verification.md
      - Jac gotchas: contributing/jac-gotchas.md
      - Writing these docs: contributing/docs.md
