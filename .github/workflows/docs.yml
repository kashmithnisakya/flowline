# Build the docs site (docs/mkdocs.yml) and publish it to GitHub Pages. The
# API reference is generated from the Jac sources, so a PR touching walkers or
# models rebuilds it too: --strict fails on broken links, stale directives and
# walkers routed from main.jac that no page documents.
name: Docs

on:
  push:
    branches: [dev]
    paths:
      - "docs/**"
      - "models.jac"
      - "constants.jac"
      - "main.jac"
      - "services/**"
      - "jac.toml"
      - "assets/brand/**"
      - "gifs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "models.jac"
      - "constants.jac"
      - "main.jac"
      - "services/**"
      - "jac.toml"
      - "assets/brand/**"
      - "gifs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: mkdocs build --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install MkDocs
        run: pip install -r docs/requirements.txt

      - name: Build
        run: mkdocs build -f docs/mkdocs.yml --strict

      - name: Upload the site for Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site

  # Pages must be set to deploy from GitHub Actions once (Settings > Pages).
  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
