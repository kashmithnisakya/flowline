# Format, lint and type-check every tracked .jac file with the jac release
# pinned in jac.toml. Formatter output differs between jac release lines
# (0.34.x vs 0.36.x disagree on line breaking), so the pin is what makes the
# fmt check reproducible: format locally with the same version this job
# installs, not with whatever `jac` happens to be on PATH.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jac:
    name: jac fmt / lint / check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read the jac version pinned in jac.toml
        id: pin
        run: |
          version="$(sed -nE 's/^jac-version *= *"(==)?([0-9][0-9.]*)".*/\2/p' jac.toml)"
          if [ -z "$version" ]; then
            echo "::error file=jac.toml::jac-version must be an exact pin, e.g. jac-version = \"==0.34.14\""
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install jac ${{ steps.pin.outputs.version }}
        env:
          # The installer resolves the release through the GitHub API; the
          # token keeps it off the unauthenticated per-IP rate limit shared by
          # all runners.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/jaseci-labs/jaseci/main/scripts/install.sh \
            | bash -s -- --version "${{ steps.pin.outputs.version }}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: jac --version
        run: jac --version

      # components/ui/ is jac-shadcn: `jac install --shadcn <name>` rewrites
      # those files verbatim from the registry, so holding them to the
      # formatter would go red on the next install. They still get linted and
      # type-checked below.
      - name: Format check (jac fmt --check --lintfix)
        run: |
          git ls-files -z -- '*.jac' ':!components/ui/*' \
            | xargs -0 jac fmt --check --lintfix

      # Lint and type check still run when the format check fails, so one run
      # reports all three signals; the job fails if any step does.
      - name: Lint (jac check --lint)
        if: ${{ !cancelled() }}
        run: |
          git ls-files -z -- '*.jac' \
            | xargs -0 jac check --lint --

      # `jac check main.jac` does not report errors inside imported modules,
      # so every file is checked on its own. Two passes, on purpose: on a cold
      # .jac/cache the 0.34.x placement solver has not yet settled glob-only
      # modules (components/workflow/kinds.jac, constants.jac, ...) as client
      # code when a lone component that imports them is analysed, and reports
      # E5082 "no client-side presence" for imports that build fine from
      # main.jac. The first pass seeds the cache with settled placements (its
      # exit code is ignored); the second pass is the one that counts, and
      # real errors survive it. --disable-error-code E5082 lets enough of the
      # first pass complete to seed the cache. A genuine E5082 still fails
      # `jac run` / `jac build`.
      - name: Type check (jac check)
        if: ${{ !cancelled() }}
        run: |
          check() {
            git ls-files -z -- '*.jac' \
              | xargs -0 jac check --nowarn --disable-error-code E5082 "$@" --
          }
          # The warm-up's E5082 misses are the cold-cache artefact described
          # above, so only its summary line is shown; the log stays readable.
          check --no-print_errs > warmup.log 2>&1 || true
          echo "warm-up pass (seeds .jac/cache, cold-cache E5082 misses expected, result ignored):"
          tail -n 1 warmup.log
          check

  # The other half of CI: does the app actually come up? flowline-dev went
  # API-only on 2026-09-08 because the deploy skipped the client bundle, and
  # nothing here ran the deploy path. This job renders the deploy manifests
  # (dry run) and asserts they build a client and run two workers, then boots
  # `jac run --no-dev` and drives it over HTTP and in a real browser.
  serve:
    name: app serves / API / browser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Read the jac version pinned in jac.toml
        id: pin
        run: |
          version="$(sed -nE 's/^jac-version *= *"(==)?([0-9][0-9.]*)".*/\2/p' jac.toml)"
          if [ -z "$version" ]; then
            echo "::error file=jac.toml::jac-version must be an exact pin"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install jac ${{ steps.pin.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/jaseci-labs/jaseci/main/scripts/install.sh \
            | bash -s -- --version "${{ steps.pin.outputs.version }}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: jac install (python + npm dependencies)
        run: jac install

      # `bundle_storage_class` is the placeholder for the RWX check a real
      # deploy satisfies on the platform; it is added to a scratch copy only.
      - name: Deploy gate (dry-run manifests build a client bundle and run 2 workers)
        run: |
          cp jac.toml /tmp/jac.toml.orig
          trap 'mv /tmp/jac.toml.orig jac.toml' EXIT
          python3 - <<'PY'
          s = open("jac.toml", encoding="utf-8").read()
          s = s.replace("[scale.kubernetes]\n", '[scale.kubernetes]\nbundle_storage_class = "ci-placeholder"\n', 1)
          open("jac.toml", "w", encoding="utf-8").write(s)
          PY
          jac scale deploy --dry-run --show-yaml main.jac > manifests.yaml
          python3 tests/smoke/deploy_gate.py manifests.yaml

      # A local GitHub stand-in so the connect round trip, the poll and the
      # webhook receiver run with no credentials. The App JWT needs a real
      # RSA key to sign with; the stub never checks it.
      - name: GitHub stub (background) and the App env the server reads
        run: |
          nohup python3 tests/smoke/github_stub.py 8099 > stub.log 2>&1 &
          {
            echo "GITHUB_API_BASE=http://127.0.0.1:8099"
            echo "GITHUB_WEB_BASE=http://127.0.0.1:8099"
            echo "GITHUB_APP_ID=1"
            echo "GITHUB_APP_SLUG=ci-app"
            echo "GITHUB_APP_CLIENT_ID=ci-client"
            echo "GITHUB_APP_CLIENT_SECRET=ci-secret"
            echo "GITHUB_APP_PRIVATE_KEY=$(openssl genrsa 2048 2>/dev/null | base64 | tr -d '\n')"
            echo "GITHUB_APP_WEBHOOK_SECRET=ci-webhook-secret"
          } >> "$GITHUB_ENV"

      - name: Serve the app (jac run --no-dev, background)
        run: |
          nohup jac run --no-dev --port 8000 main.jac > serve.log 2>&1 &
          echo $! > serve.pid

      - name: API gate (shell, bundle, register, login, walkers, concurrency)
        run: python3 tests/smoke/api_gate.py http://localhost:8000

      - name: Webhook gate (connect, back-fill, signed deliveries, drain, isolation)
        run: python3 tests/smoke/webhook_gate.py http://localhost:8000 http://127.0.0.1:8099

      - name: Two worker processes are serving
        run: grep -E "supervising [2-9][0-9]* worker" serve.log

      - name: Install Playwright
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium

      - name: Browser gate (sign up, setup, flow line, New task, card)
        run: python3 tests/smoke/browser_gate.py http://localhost:8000

      - name: Failure screenshot
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-gate-failure
          path: browser_gate_failure.png
          if-no-files-found: ignore

      - name: Server log
        if: ${{ always() }}
        run: |
          tail -n 150 serve.log || true
          tail -n 20 stub.log || true
