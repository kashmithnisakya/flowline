# Builds the app's .jab with the jac release pinned in jac.toml and attaches
# it, with its checksum, to the GitHub release. The .jab holds tracked source
# only: environment values never ride in it (they are set per environment).
# Run it by hand to get the same files as a workflow artifact, no release.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  jab:
    name: build the .jab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read the jac version pinned in jac.toml
        id: pin
        run: |
          version="$(sed -nE 's/^jac-version *= *"(==)?([0-9][0-9.]*)".*/\2/p' jac.toml)"
          if [ -z "$version" ]; then
            echo "::error file=jac.toml::jac-version must be an exact pin"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install jac ${{ steps.pin.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/jaseci-labs/jaseci/main/scripts/install.sh \
            | bash -s -- --version "${{ steps.pin.outputs.version }}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: jac install
        run: jac install

      # `jac build` type-checks first, then packs the tracked files.
      - name: Build the .jab
        id: build
        run: |
          jac build -o build/out.jab
          built="$(find build/out.jab -name '*.jab' -type f | head -n 1)"
          test -n "$built" || { echo "::error::jac build produced no .jab"; exit 1; }
          name="flowline-${{ github.event.release.tag_name || github.sha }}.jab"
          mkdir -p dist
          cp "$built" "dist/$name"
          (cd dist && sha256sum "$name" > "$name.sha256")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          ls -l dist

      # The bundle must never carry a local environment file.
      - name: Check the .jab holds no env file
        run: |
          if tar -tzf "dist/${{ steps.build.outputs.name }}" | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then
            echo "::error::the .jab contains an env file"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.name }}
          path: dist/

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
