# standup app on minikube.
#
# Reuses the MongoDB and Redis that `jac start --scale` already provisioned
# (standup-mongodb-secret / standup-redis-secret, key `connection-string`), so
# the data layer is exactly what the supported path would have created.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: standup-app
  labels: {app: standup}
spec:
  replicas: 1
  selector:
    matchLabels: {app: standup}
  template:
    metadata:
      labels: {app: standup}
    spec:
      containers:
        - name: standup
          image: standup-app:local
          imagePullPolicy: Never          # built straight into minikube's docker daemon
          ports:
            - containerPort: 8000
          env:
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef: {name: standup-mongodb-secret, key: connection-string}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef: {name: standup-redis-secret, key: connection-string}
            - name: HOST
              value: "http://localhost:30080"
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 120
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: standup-app-service
spec:
  type: NodePort
  selector: {app: standup}
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
