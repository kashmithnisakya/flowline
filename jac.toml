[project]
name = "flowline"
# A dotted module name, the only spelling jac 0.37.12+ loads.
entry-point = "main"
kind = "web-app"
jac-version = "==0.37.14"

[jac-shadcn]
style = "nova"
baseColor = "neutral"
theme = "neutral"
font = "figtree"
radius = "default"
menuAccent = "subtle"
menuColor = "default"

[dependencies]
prometheus_client = "*"
requests = "*"
pyjwt = "*"
cryptography = "*"

[dependencies.npm]
"react-markdown" = "*"
"remark-gfm" = "*"
sonner = "*"
"@hugeicons/react" = "*"
"@hugeicons/core-free-icons" = "*"
radix-ui = "*"
class-variance-authority = "*"
"@fontsource-variable/figtree" = "*"
shadcn = "^3.8.5"
"@tailwindcss/vite" = "^4.1.17"
tailwindcss = "^4.1.17"
clsx = "^2.1.1"
tailwind-merge = "^3.5.0"
tw-animate-css = "^1.4.0"
"@fontsource-variable/archivo" = "latest"
"@fontsource/ibm-plex-mono" = "latest"

[client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

[client.app_meta_data]
title = "Flowline"
description = "Draw how your team works. The steps you name become the board's columns, and every card that moves writes a line in the daily log. Open source, MIT licensed."
theme_color = "#F2F3F1"
icon = "/static/brand/favicon.svg"
og_title = "Flowline: draw how your team works"
og_description = "Name your steps once. They become the board's columns, every card that moves writes a line in the log, and linked GitHub issues can move cards when you turn that on."
og_type = "website"
og_image = "${HOST:-http://localhost:8000}/static/brand/og-image.png"
og_image_width = "1200"
og_image_height = "630"
twitter_card = "summary_large_image"
twitter_image = "${HOST:-http://localhost:8000}/static/brand/og-image.png"

# Runs before the bundle. The same text as lib/boot.js (keep the two in step):
# the saved theme on <html>, a preload of the Archivo file the header uses,
# then a header and page placeholder that pages/layout.jac removes on its
# first paint.
[[client.app_meta_data.scripts]]
content = '''
/* Flowline boot (inlined into <head> from jac.toml, before the bundle):
   theme on <html>, an Archivo preload, an app-path placeholder
   that pages/layout.jac removes on first paint. */
(function(){
var d=document,h=d.documentElement;
function g(k){try{return localStorage.getItem(k)}catch(e){}}
var t=g('flowline-theme')||g('standup-theme');
var dark=t=='dark'||t!='light'&&matchMedia('(prefers-color-scheme:dark)').matches;
var bg=dark?'#111413':'#F2F3F1';
if(dark)h.className+=' dark';
h.style.colorScheme=dark?'dark':'light';h.style.backgroundColor=bg;
d.head.insertAdjacentHTML('beforeend','<link rel=preload as=font crossorigin href=/archivo-latin-wdth-normal.woff2>');
if(/^\/(login|auth\/callback|setup)?$/.test(location.pathname)||!g('jac_token'))return;
var s=dark?'#191D1B':'#fff',l=dark?'#2D3330':'#D3D8D2',k=dark?'#1E2220':'#DEDFDD';
var c='.bm,.ba,.bo,.bn,.bd,.bq,.bt,.bl{display:block;background:'+k+';border-radius:4px}.bh{display:flex;align-items:center;gap:2px;height:47px;padding:0 16px;background:'+s+';border-bottom:1px solid '+l+'}'
+'.bm,.ba{border-radius:50%}.bm{width:20px;height:20px;margin-right:8px}.ba{width:24px;height:24px;margin:0 4px}.bo{width:112px;height:14px;margin-right:12px}.bn{height:12px;margin:0 10px}.bd{width:1px;height:20px;margin:0 8px;background:'+l+'}'
+'.br{margin-left:auto;display:flex;align-items:center;gap:6px}.bq{width:65px;height:28px;border:1px solid '+l+';background:'+bg+'}.bo,.bd,.bs{display:none}.bp{padding:24px 16px}.bt{width:104px;height:24px;margin:6px 0 24px}.bl{height:14px;margin-bottom:14px}'
+'@media(max-width:639px){.bn{display:none}.bo{display:block;width:72px}.bq{width:20px;height:20px;margin:10px;border:0;background:'+k+'}}@media(min-width:640px){.bp{padding:24px}}'
+'@media(min-width:1024px){.bh{padding:0 20px}.bo,.bd,.bs{display:block}.bx{display:none}.bp{padding:32px 40px}}';
function n(x,y){return '<i class="bn '+(y||'')+'"style=width:'+x+'px></i>'}
function b(w){return '<i class=bl style=width:'+w+'%></i>'}
var e=d.createElement('div');e.id='flowline-boot';
e.innerHTML='<style>'+c+'</style><div class=bh><i class=bm></i><i class=bo></i>'
+n(36)+n(34)+n(57)+n(20)+n(55)+n(48,'bx')+'<i class=bd></i>'+n(51,'bs')+n(63,'bs')+n(40,'bs')
+'<div class=br><i class=bq></i>'+n(50)+'<i class=ba></i></div></div><div class=bp><i class=bt></i>'+b(42)+b(58)+b(36)+'</div>';
var o=new MutationObserver(p);
function p(){if(d.body){o.disconnect();d.body.prepend(e)}}
o.observe(h,{childList:!0,subtree:!0});p();
})();
'''

[byllm]
system_prompt = "You are the assistant inside Flowline, a kanban and daily-log tool for small teams. Answer ONLY from the workspace snapshot you are given. Never invent tasks, people, projects or dates: if the snapshot does not contain the answer, say so plainly. Team members do not have accounts, so always write about them in the third person. Be terse and concrete."

[byllm.model]
default_model = "${LLM_MODEL:-gpt-4o-mini}"

[byllm.call_params]
temperature = 0.2
max_output_retries = 3

# Two worker processes per app pod (matches the 2000m cpu_limit below); the
# gateway pod gets the same count. Dev mode is single-process: run
# `jac run -w 1 main.jac`, or keep JAC_SERVE_WORKERS=1 in .env.
[serve.workers]
count = "2"

[scale.sso]
host = "${HOST:-http://localhost:8000}"
client_auth_callback_url = "${HOST:-http://localhost:8000}/auth/callback"

[scale.sso.google]
client_id = "${GOOGLE_CLIENT_ID:-}"
client_secret = "${GOOGLE_CLIENT_SECRET:-}"

[scale.sso.github]
client_id = "${GITHUB_CLIENT_ID:-}"
client_secret = "${GITHUB_CLIENT_SECRET:-}"

# /metrics, walker metrics and one Prometheus + Grafana pair in the namespace.
# k8s_metrics_enabled defaults to true and adds kube-state-metrics plus a
# node-exporter DaemonSet (one pod on EVERY node of the shared cluster);
# `jachammer top` already reports pod CPU and memory from metrics-server.
[scale.monitoring]
enabled = true
endpoint = "/metrics"
namespace = "flowline"
walker_metrics = true
prometheus_admin_password = "${GRAFANA_ADMIN_PASSWORD}"
k8s_metrics_enabled = false

[scale.kubernetes]
app_name = "flowline"
# App pod sizing. Only [apps.flowline.scale] can set workers = "auto", but on
# jac 0.37.7 an [apps] table makes the deploy skip the client bundle (API-only
# pods, / is a JSON 404), so the app stays under [project] and the worker
# count is fixed in [serve.workers] instead.
cpu_request = "1000m"
cpu_limit = "2000m"
# Every HPA jac-scale renders also scales on memory (80% of the request), and
# memory does not spread across replicas, so a request below the idle working
# set pins max_replicas with no load. 2.37Gi was measured idle at ONE worker;
# two workers sit above the 2.4Gi threshold the old 3Gi request gave.
memory_request = "4Gi"
memory_limit = "6Gi"
# jac-scale hands these bounds to EVERY service, the gateway included, unless
# [scale.gateway.hpa] overrides them (it does, below).
min_replicas = 2
max_replicas = 6
cpu_utilization_target = 70
autoscaler_scale_up_max_pods = 4

[scale.gateway]
http_forward_timeout = 120.0
cpu_request = "100m"
# [serve.workers] reaches the gateway pod too, so two gateway processes sit
# above the 512Mi that was sized for one, and the HPA memory metric scaled the
# gateway out. jac-scale's own gateway default is 2Gi.
memory_request = "1Gi"
memory_limit = "2Gi"

# The gateway only proxies (~1m CPU at 25 req/s on dev). Without this table it
# inherits the app's 2 -> 6 bounds above, which ran four gateway pods on dev.
[scale.gateway.hpa]
min = 1
max = 2

# Loki plus an Alloy DaemonSet (one pod per node). Alloy reads pods cluster-wide
# and Grafana's logs view queries every namespace, so on the shared jachammer
# cluster it exposes other tenants' logs as well as costing a pod per node.
[scale.gateway.logs]
enabled = false

[jacpack]
name = 'flowline'
description = 'Jac IDE snapshot for flowline'

# GitHub App deliveries land on /webhook/GithubEvent. The runtime verifies
# X-Hub-Signature-256 against this secret before the walker runs, so an
# empty or wrong value means every delivery is refused, never applied.
[scale.webhook]
github_secret = "${GITHUB_APP_WEBHOOK_SECRET}"
max_body_bytes = 2097152

[placement]
default = "server"

[placement.pins]
"lib.utils.fmtEstimate" = "client"
"lib.utils.normalizeRepoInput" = "client"
"lib.utils.parseEstimate" = "client"
models = "server"
"services.assistant.assistant" = "server"
"services.board.board" = "server"
"services.flowlines.flowlines" = "server"
"services.github.events" = "server"
"services.github.github" = "server"
"services.github.util" = "server"
"services.insights.insights" = "server"
"services.iterations.iterations" = "server"
"services.log.log" = "server"
"services.projects.projects" = "server"
"services.roster.roster" = "server"
"services.tasks.tasks" = "server"
"services.util" = "server"
