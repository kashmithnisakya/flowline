[project]
name = "standup"
entry-point = "main.jac"
kind = "web-app"
jac-version = "==0.34.14"

[jac-shadcn]
style = "nova"
baseColor = "neutral"
theme = "neutral"
font = "figtree"
radius = "default"
menuAccent = "subtle"
menuColor = "default"

[dependencies]
# Required by [scale.monitoring]. Without it the metrics factory falls back to
# a no-op collector whose is_enabled() is False, so /metrics is never
# registered and the endpoint 404s with no warning.
prometheus_client = "*"
# walkers/ghutil.jac talks to the GitHub REST API and signs the GitHub App
# JWT. All three arrive transitively today (litellm pulls them in), but a
# runtime upgrade that drops that chain would break the GitHub tab with an
# ImportError, so they are named here as direct dependencies.
requests = "*"
pyjwt = "*"
# PyJWT needs it for RS256; the App JWT is unsigned-able without it.
cryptography = "*"

[dependencies.npm]
# Task notes are written as markdown and rendered by
# components/common/Markdown.jac. react-markdown never emits raw HTML, so
# the notes stay safe to display; remark-gfm adds task lists, tables,
# strikethrough and bare-URL autolinks. Note that `jac install` rewrites
# this file and drops comments, so check them back in after running it.
"react-markdown" = "*"
"remark-gfm" = "*"
sonner = "*"
"@hugeicons/react" = "*"
"@hugeicons/core-free-icons" = "*"
radix-ui = "*"
class-variance-authority = "*"
"@fontsource-variable/figtree" = "*"
shadcn = "^3.8.5"
"@tailwindcss/vite" = "^4.1.17"
tailwindcss = "^4.1.17"
clsx = "^2.1.1"
tailwind-merge = "^3.5.0"
tw-animate-css = "^1.4.0"
"@fontsource-variable/bricolage-grotesque" = "latest"
"@fontsource-variable/space-grotesk" = "latest"

[client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

[client.app_meta_data]
title = "flowline"
description = "A kanban board per project and a written daily log. Everything a standup does, none of the 9:45."
theme_color = "#F6F2EB"
icon = "/static/brand/favicon.svg"

[byllm]
system_prompt = "You are the assistant inside Flowline, a kanban and daily-log tool for small teams. Answer ONLY from the workspace snapshot you are given. Never invent tasks, people, projects or dates: if the snapshot does not contain the answer, say so plainly. Team members do not have accounts, so always write about them in the third person. Be terse and concrete."

[byllm.model]
default_model = "${LLM_MODEL:-gpt-4o-mini}"

[byllm.call_params]
temperature = 0.2
max_output_retries = 3

[serve]
base_route_app = "app"

[scale.sso]
host = "${HOST:-http://localhost:8000}"
client_auth_callback_url = "${HOST:-http://localhost:8000}/auth/callback"

[scale.sso.google]
client_id = "${GOOGLE_CLIENT_ID}"
client_secret = "${GOOGLE_CLIENT_SECRET}"

[scale.sso.github]
client_id = "${GITHUB_CLIENT_ID}"
client_secret = "${GITHUB_CLIENT_SECRET}"

[scale.monitoring]
enabled = true
endpoint = "/metrics"
namespace = "standup"
walker_metrics = true
prometheus_admin_password = "${GRAFANA_ADMIN_PASSWORD}"

[jacpack]
name = 'standup'
description = 'Jac IDE snapshot for standup'
