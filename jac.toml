[project]
name = "flowline"
jac-version = "==0.37.7"

# The one app, declared as an [apps] table rather than [project] kind/entry-point:
# per-app pod sizing (workers above all) is read only from [apps.<name>.scale],
# and the implicit app has no such table.
[apps.flowline]
kind = "web-app"
entry-point = "main.jac"

# App pod sizing. `workers = "auto"` forks one worker per core of the CPU limit,
# so the limit is the one knob: 2000m is 2 workers, each escaping the GIL that
# capped a pod at ~1000m before jac 0.37 (#140). A pod idles at ~1.7Gi on 0.37.7;
# keep the memory request above that or the HPA memory metric pins max_replicas.
[apps.flowline.scale]
workers = "auto"
cpu_request = "1000m"
cpu_limit = "2000m"
memory_request = "3Gi"
memory_limit = "6Gi"

[jac-shadcn]
style = "nova"
baseColor = "neutral"
theme = "neutral"
font = "figtree"
radius = "default"
menuAccent = "subtle"
menuColor = "default"

[dependencies]
prometheus_client = "*"
requests = "*"
pyjwt = "*"
cryptography = "*"

[dependencies.npm]
"react-markdown" = "*"
"remark-gfm" = "*"
sonner = "*"
"@hugeicons/react" = "*"
"@hugeicons/core-free-icons" = "*"
radix-ui = "*"
class-variance-authority = "*"
"@fontsource-variable/figtree" = "*"
shadcn = "^3.8.5"
"@tailwindcss/vite" = "^4.1.17"
tailwindcss = "^4.1.17"
clsx = "^2.1.1"
tailwind-merge = "^3.5.0"
tw-animate-css = "^1.4.0"
"@fontsource-variable/bricolage-grotesque" = "latest"
"@fontsource-variable/space-grotesk" = "latest"

[client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

[client.app_meta_data]
title = "flowline"
description = "A kanban board per project and a written daily log. Everything a standup does, none of the 9:45."
theme_color = "#F6F2EB"
icon = "/static/brand/favicon.svg"

[byllm]
system_prompt = "You are the assistant inside Flowline, a kanban and daily-log tool for small teams. Answer ONLY from the workspace snapshot you are given. Never invent tasks, people, projects or dates: if the snapshot does not contain the answer, say so plainly. Team members do not have accounts, so always write about them in the third person. Be terse and concrete."

[byllm.model]
default_model = "${LLM_MODEL:-gpt-4o-mini}"

[byllm.call_params]
temperature = 0.2
max_output_retries = 3

[scale.sso]
host = "${HOST:-http://localhost:8000}"
client_auth_callback_url = "${HOST:-http://localhost:8000}/auth/callback"

[scale.sso.google]
client_id = "${GOOGLE_CLIENT_ID}"
client_secret = "${GOOGLE_CLIENT_SECRET}"

[scale.sso.github]
client_id = "${GITHUB_CLIENT_ID}"
client_secret = "${GITHUB_CLIENT_SECRET}"

[scale.monitoring]
enabled = true
endpoint = "/metrics"
namespace = "flowline"
walker_metrics = true
prometheus_admin_password = "${GRAFANA_ADMIN_PASSWORD}"

[scale.kubernetes]
app_name = "flowline"
# HPA bounds, shared by the app and gateway deployments. Pod sizing lives with
# each pod instead: [apps.flowline.scale] and [scale.gateway].
min_replicas = 2
# 6 pods x 2 workers is 12 cores, above the 10 x 1 ceiling before, on fewer pods
# (the dev cluster already reports "Too many pods" when scheduling).
max_replicas = 6
# 70% of the app's 1000m request scales out at ~700m, a third of the 2000m limit.
# Against the 50m default request the HPA sat at 1811%/50%, pinned at max.
cpu_utilization_target = 70
autoscaler_scale_up_max_pods = 4

[scale.gateway]
http_forward_timeout = 120.0
# The gateway only proxies: 161Mi and ~1m CPU on dev under a 25 req/s load.
cpu_request = "100m"
memory_request = "512Mi"
memory_limit = "2Gi"

[scale.gateway.logs]
enabled = true

[jacpack]
name = 'flowline'
description = 'Jac IDE snapshot for flowline'

# Pure modules stay on the server codespace (dual-emitted to the client by
# reference). Left at the "native" default, `jac build --as client` (what a
# deploy runs) compiles constants.jac to wasm and STATUSES reads as undefined
# in the browser; `jac run` does not reproduce it.
[placement]
default = "server"

# Placement overrides (jac 0.37, see CLAUDE.md). Module-level "server" pins make
# a page's walker import a service-boundary import (RPC stubs + wire types)
# instead of pulling the walker module into the browser bundle. Every new
# walkers/* module needs a line here.
[placement.pins]
"lib.utils.fmtEstimate" = "client"
"lib.utils.normalizeRepoInput" = "client"
"lib.utils.parseEstimate" = "client"
models = "server"
"walkers.assistant" = "server"
"walkers.board" = "server"
"walkers.flowlines" = "server"
"walkers.ghutil" = "server"
"walkers.github" = "server"
"walkers.insights" = "server"
"walkers.log" = "server"
"walkers.projects" = "server"
"walkers.roster" = "server"
"walkers.tasks" = "server"
"walkers.util" = "server"
