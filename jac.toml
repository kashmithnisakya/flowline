[project]
name = "flowline"
entry-point = "main.jac"
kind = "web-app"
jac-version = "==0.36.1"

[jac-shadcn]
style = "nova"
baseColor = "neutral"
theme = "neutral"
font = "figtree"
radius = "default"
menuAccent = "subtle"
menuColor = "default"

[dependencies]
prometheus_client = "*"
requests = "*"
pyjwt = "*"
cryptography = "*"

[dependencies.npm]
"react-markdown" = "*"
"remark-gfm" = "*"
sonner = "*"
"@hugeicons/react" = "*"
"@hugeicons/core-free-icons" = "*"
radix-ui = "*"
class-variance-authority = "*"
"@fontsource-variable/figtree" = "*"
shadcn = "^3.8.5"
"@tailwindcss/vite" = "^4.1.17"
tailwindcss = "^4.1.17"
clsx = "^2.1.1"
tailwind-merge = "^3.5.0"
tw-animate-css = "^1.4.0"
"@fontsource-variable/bricolage-grotesque" = "latest"
"@fontsource-variable/space-grotesk" = "latest"

[client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

[client.app_meta_data]
title = "flowline"
description = "A kanban board per project and a written daily log. Everything a standup does, none of the 9:45."
theme_color = "#F6F2EB"
icon = "/static/brand/favicon.svg"

[byllm]
system_prompt = "You are the assistant inside Flowline, a kanban and daily-log tool for small teams. Answer ONLY from the workspace snapshot you are given. Never invent tasks, people, projects or dates: if the snapshot does not contain the answer, say so plainly. Team members do not have accounts, so always write about them in the third person. Be terse and concrete."

[byllm.model]
default_model = "${LLM_MODEL:-gpt-4o-mini}"

[byllm.call_params]
temperature = 0.2
max_output_retries = 3

[serve]
base_route_app = "app"

[scale.sso]
host = "${HOST:-http://localhost:8000}"
client_auth_callback_url = "${HOST:-http://localhost:8000}/auth/callback"

[scale.sso.google]
client_id = "${GOOGLE_CLIENT_ID}"
client_secret = "${GOOGLE_CLIENT_SECRET}"

[scale.sso.github]
client_id = "${GITHUB_CLIENT_ID}"
client_secret = "${GITHUB_CLIENT_SECRET}"

[scale.monitoring]
enabled = true
endpoint = "/metrics"
namespace = "flowline"
walker_metrics = true
prometheus_admin_password = "${GRAFANA_ADMIN_PASSWORD}"

[scale.kubernetes]
app_name = "flowline"
# Sized from a load test against flowline-dev (2026-09-02). Under load an app pod
# pegs at ~1000m and goes no higher: `jac start` is one process, so the GIL caps
# pure-Python work at one core however many the node has. Capacity is therefore
# pods, not cores per pod -- hence the higher ceiling and the honest request.
cpu_request = "500m"
memory_request = "1Gi"
memory_limit = "4Gi"
min_replicas = 2
max_replicas = 10
# 70% of a 500m request leaves real headroom under the ~1000m ceiling. Against the
# 50m default request the HPA sat at 1811%/50%, permanently pinned at max.
cpu_utilization_target = 70
autoscaler_scale_up_max_pods = 4

[scale.microservices]
enabled = true
http_forward_timeout = 120.0

[scale.microservices.logs]
enabled = true

[jacpack]
name = 'flowline'
description = 'Jac IDE snapshot for flowline'
